{% extends "base.html" %}


{% block content %}
  <table>
    <tr valign="top">
      <td>
        <img src="{{ user.avatar(128) }}" alt="Avatar de {{ user.username }}" width="128" height="128">
      </td>
      <td>
        <h1>Usuário: {{ user.username }}</h1>
        {% if user.about_me %}<p>{{ user.about_me }}</p>{% endif %}
        {% if user.last_seen %}<p>Última vez visto em:{{ user.last_seen }}</p>
      </td>
    </tr>

  </table>
  <hr> 
  {% for post in posts %}
      {% include '_post.html' %}
  {% endfor %}
{% endblock %}
